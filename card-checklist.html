<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Card Checklist</title>
<style>
:root{--bg:#0a0d14;--s1:#111520;--s2:#161c2a;--b:#1e2535;--gold:#c4a050;--blue:#4b9ee8;--green:#4be87a;--red:#e85050;--purple:#9b6be8;--text:#d4d8e8;--sub:#7a8098;--muted:#4a5068}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'SF Mono','Cascadia Code',monospace;font-size:13px;line-height:1.6}
#app{display:grid;grid-template-rows:auto auto 1fr;height:100vh}
/* HEADER */
header{background:var(--s1);border-bottom:1px solid var(--b);padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:16px;color:var(--gold);letter-spacing:.1em;font-weight:700;white-space:nowrap}
.header-stats{display:flex;gap:12px;flex-wrap:wrap;flex:1}
.stat-pill{background:var(--bg);border:1px solid var(--b);border-radius:20px;padding:3px 12px;font-size:11px;color:var(--sub)}
.stat-pill span{color:var(--green);font-weight:700}
/* CONTROLS */
#controls{background:var(--s2);border-bottom:1px solid var(--b);padding:10px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select,input[type=text]{background:var(--bg);border:1px solid var(--b);color:var(--text);padding:5px 10px;border-radius:4px;font-family:inherit;font-size:12px;outline:none}
select:focus,input:focus{border-color:var(--gold)}
#search{width:200px}
.btn{background:var(--bg);border:1px solid var(--b);color:var(--sub);padding:5px 12px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.active{border-color:var(--gold);color:var(--gold);background:rgba(196,160,80,.08)}
.sep{color:var(--muted);font-size:10px}
/* MAIN */
#main{display:grid;grid-template-columns:220px 1fr;overflow:hidden}
/* SIDEBAR */
#sidebar{background:var(--s1);border-right:1px solid var(--b);overflow-y:auto;padding:12px 0}
.game-group{margin-bottom:4px}
.game-label{padding:8px 14px 4px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.set-item{padding:7px 14px;cursor:pointer;border-left:2px solid transparent;display:flex;justify-content:space-between;align-items:center;transition:all .15s}
.set-item:hover{background:var(--s2);color:var(--text)}
.set-item.active{border-left-color:var(--gold);background:var(--s2);color:var(--gold)}
.set-item .set-name{font-size:12px;color:inherit}
.set-item .set-prog{font-size:10px;color:var(--muted)}
.set-item .set-bar{height:2px;background:var(--b);border-radius:1px;margin-top:4px;overflow:hidden}
.set-item .set-fill{height:100%;background:var(--green);border-radius:1px;transition:width .3s}
/* CARD TABLE */
#content{overflow:auto;background:var(--bg)}
table{width:100%;border-collapse:collapse;min-width:600px}
thead th{position:sticky;top:0;background:var(--s2);padding:8px 12px;text-align:left;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--b);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--gold)}
thead th.sorted{color:var(--gold)}
tbody tr{border-bottom:1px solid rgba(30,37,53,.7);transition:background .1s}
tbody tr:hover{background:var(--s1)}
tbody tr.owned{background:rgba(75,232,122,.04)}
tbody tr.owned:hover{background:rgba(75,232,122,.07)}
td{padding:7px 12px;vertical-align:middle}
td.check{width:36px;text-align:center}
td.check input[type=checkbox]{width:15px;height:15px;accent-color:var(--green);cursor:pointer}
td.num{color:var(--muted);font-size:11px;width:70px}
td.name{color:var(--text);font-weight:600}
td.set-col{color:var(--sub);font-size:11px}
td.rarity{font-size:11px}
td.type-col{color:var(--sub);font-size:11px}
td.side{font-size:11px;width:60px}
.r-holo{color:#f5d76e}
.r-rare{color:var(--gold)}
.r-uncommon{color:var(--blue)}
.r-common{color:var(--sub)}
.r-secret{color:var(--purple)}
.r-r1{color:#f5d76e}
.r-r2{color:var(--gold)}
.r-u1{color:var(--blue)}
.r-u2{color:#7ab8e8}
.r-c1{color:#5a8098}
.r-c2{color:var(--sub)}
.r-c3{color:var(--muted)}
.side-light{color:#e8d44b}
.side-dark{color:#e87a4b}
.badge{display:inline-block;padding:1px 7px;border-radius:3px;font-size:10px;font-weight:600;letter-spacing:.05em}
.badge-partial{background:rgba(232,80,80,.1);color:var(--red);border:1px solid rgba(232,80,80,.3)}
.partial-notice{padding:20px;color:var(--sub);font-size:12px;line-height:1.8}
.partial-notice a{color:var(--blue)}
/* EMPTY */
.empty{padding:40px;text-align:center;color:var(--muted);font-size:13px}
/* PROGRESS BAR FOOTER */
.prog-footer{position:sticky;bottom:0;background:var(--s2);border-top:1px solid var(--b);padding:6px 16px;display:flex;align-items:center;gap:16px;font-size:11px;color:var(--sub)}
.prog-bar-wrap{flex:1;height:4px;background:var(--b);border-radius:2px;overflow:hidden}
.prog-bar-fill{height:100%;background:var(--green);border-radius:2px;transition:width .4s}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>&#9670; CARD CHECKLIST</h1>
  <div class="header-stats">
    <div class="stat-pill">Total: <span id="statTotal">0</span></div>
    <div class="stat-pill">Owned: <span id="statOwned">0</span></div>
    <div class="stat-pill">Missing: <span id="statMissing">0</span></div>
    <div class="stat-pill">Complete: <span id="statPct">0%</span></div>
  </div>
  <button class="btn" onclick="clearAll()">Clear All</button>
  <button class="btn" onclick="checkAll()">Check Visible</button>
</header>
<div id="controls">
  <input type="text" id="search" placeholder="Search cards..." oninput="render()">
  <select id="filtRarity" onchange="render()">
    <option value="">All Rarities</option>
    <option>Holo Rare</option><option>Rare</option><option>Uncommon</option><option>Common</option>
    <option>Secret Rare</option><option>R1</option><option>R2</option><option>U1</option><option>U2</option><option>C1</option><option>C2</option><option>R</option><option>U</option><option>C</option><option>F</option><option>XR</option><option>UR</option>
  </select>
  <select id="filtSide" onchange="render()">
    <option value="">All Sides</option>
    <option>Light</option><option>Dark</option><option>N/A</option>
  </select>
  <select id="filtOwned" onchange="render()">
    <option value="">Show All</option>
    <option value="owned">Owned Only</option>
    <option value="missing">Missing Only</option>
  </select>
  <span class="sep">|</span>
  <span style="font-size:11px;color:var(--muted)">Sort:</span>
  <button class="btn" id="sortNum" onclick="setSort('num')">Number</button>
  <button class="btn" id="sortName" onclick="setSort('name')">Name</button>
  <button class="btn" id="sortRarity" onclick="setSort('rarity')">Rarity</button>
</div>
<div id="main">
  <div id="sidebar"></div>
  <div id="content">
    <table>
      <thead>
        <tr>
          <th class="check"></th>
          <th onclick="setSort('num')">#</th>
          <th onclick="setSort('name')">Name</th>
          <th onclick="setSort('set')">Set</th>
          <th onclick="setSort('rarity')">Rarity</th>
          <th>Type</th>
          <th>Side</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="prog-footer">
      <span id="footerLabel">All Sets</span>
      <div class="prog-bar-wrap"><div class="prog-bar-fill" id="footerBar" style="width:0%"></div></div>
      <span id="footerPct">0 / 0</span>
    </div>
  </div>
</div>
</div>

// Build card objects
const CARDS = RAW.map((r,i)=>({id:i, set:r[0], num:r[1], name:r[2], rarity:r[3], type:r[4], side:r[5]}));

// ─── STATE ────────────────────────────────────────────────────────────────────
let owned = new Set(JSON.parse(localStorage.getItem('cc_owned')||'[]'));
let currentSet = 'all';
let sortField = 'num';
let sortDir = 1;

function save(){localStorage.setItem('cc_owned',JSON.stringify([...owned]))}

function toggle(id){
  if(owned.has(id)) owned.delete(id); else owned.add(id);
  save(); updateStats(); updateSidebar();
}

// ─── FILTERS ──────────────────────────────────────────────────────────────────
function filtered(){
  const q=document.getElementById('search').value.toLowerCase();
  const r=document.getElementById('filtRarity').value;
  const sd=document.getElementById('filtSide').value;
  const ow=document.getElementById('filtOwned').value;
  return CARDS.filter(c=>{
    if(currentSet!=='all' && c.set!==currentSet) return false;
    if(q && !c.name.toLowerCase().includes(q) && !c.num.toLowerCase().includes(q)) return false;
    if(r && c.rarity!==r) return false;
    if(sd && c.side!==sd) return false;
    if(ow==='owned' && !owned.has(c.id)) return false;
    if(ow==='missing' && owned.has(c.id)) return false;
    return true;
  });
}

// ─── SORT ─────────────────────────────────────────────────────────────────────
const RARITY_ORDER={'UR':-2,'XR':-1,'Holo Rare':0,'Secret Rare':1,'Rainbow Foil':2,'Silver Foil':3,'R1':4,'Rare':4,'R':4,'R2':5,'U1':6,'U':6,'Normal':7,'Uncommon':7,'U2':8,'C1':9,'Common':9,'C':9,'C2':10,'C3':11,'F':14};

function setSort(f){
  if(sortField===f) sortDir*=-1; else {sortField=f;sortDir=1;}
  document.querySelectorAll('#controls .btn[id^=sort]').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById('sort'+f.charAt(0).toUpperCase()+f.slice(1));
  if(el) el.classList.add('active');
  render();
}

function sortCards(arr){
  return [...arr].sort((a,b)=>{
    let va,vb;
    if(sortField==='rarity'){va=RARITY_ORDER[a.rarity]??99;vb=RARITY_ORDER[b.rarity]??99;}
    else if(sortField==='num'){va=a.num;vb=b.num;}
    else {va=a[sortField]||'';vb=b[sortField]||'';}
    if(va<vb) return -sortDir;
    if(va>vb) return sortDir;
    return 0;
  });
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function rarityClass(r){
  const map={'Holo Rare':'r-holo','Rare':'r-rare','Secret Rare':'r-secret','Uncommon':'r-uncommon','Common':'r-common','R1':'r-r1','R2':'r-r2','U1':'r-u1','U2':'r-u2','C1':'r-c1','C2':'r-c2','C3':'r-c3','Normal':'r-common','Silver Foil':'r-uncommon','Rainbow Foil':'r-holo'};
  return map[r]||'r-common';
}

function render(){
  const cards = sortCards(filtered());
  const tbody = document.getElementById('tbody');
  const setInfo = SETS.find(s=>s.id===currentSet);
  tbody.innerHTML = cards.map(c=>{
    const isOwned=owned.has(c.id);
    const sideClass=c.side==='Light'?'side-light':c.side==='Dark'?'side-dark':'';
    const setName=SETS.find(s=>s.id===c.set)?.name||c.set;
    return `<tr class="${isOwned?'owned':''}" onclick="toggle(${c.id})">
      <td class="check"><input type="checkbox" ${isOwned?'checked':''} onclick="event.stopPropagation();toggle(${c.id})"></td>
      <td class="num">${c.num}</td>
      <td class="name">${c.name}</td>
      <td class="set-col">${currentSet==='all'?setName:''}</td>
      <td class="rarity"><span class="${rarityClass(c.rarity)}">${c.rarity}</span></td>
      <td class="type-col">${c.type}</td>
      <td class="side"><span class="${sideClass}">${c.side==='N/A'?'—':c.side}</span></td>
    </tr>`;
  }).join('');

  // Footer
  const total=cards.length;
  const ownedCount=cards.filter(c=>owned.has(c.id)).length;
  const pct=total?Math.round(ownedCount/total*100):0;
  document.getElementById('footerLabel').textContent=setInfo?setInfo.name:'All Sets';
  document.getElementById('footerBar').style.width=pct+'%';
  document.getElementById('footerPct').textContent=`${ownedCount} / ${total}`;
  updateStats();
}

function updateStats(){
  const total=CARDS.length;
  const ownedCount=owned.size;
  document.getElementById('statTotal').textContent=total;
  document.getElementById('statOwned').textContent=ownedCount;
  document.getElementById('statMissing').textContent=total-ownedCount;
  document.getElementById('statPct').textContent=Math.round(ownedCount/total*100)+'%';
}

function updateSidebar(){
  const games=['Pokemon','SWCCG','Topps'];
  const gameLabels={Pokemon:'Pokémon TCG','SWCCG':'Star Wars CCG','Topps':'Topps Pokémon'};
  let html='';
  games.forEach(g=>{
    const sets=SETS.filter(s=>s.game===g);
    html+=`<div class="game-group"><div class="game-label">${gameLabels[g]}</div>`;
    sets.forEach(s=>{
      const cards=CARDS.filter(c=>c.set===s.id);
      const ownedCount=cards.filter(c=>owned.has(c.id)).length;
      const total=cards.length;
      const pct=total?Math.round(ownedCount/total*100):0;
      const isActive=currentSet===s.id;
      html+=`<div class="set-item ${isActive?'active':''}" onclick="selectSet('${s.id}')">
        <div>
          <div class="set-name">${s.name}${!s.complete?' <span class="badge badge-partial">partial</span>':''}</div>
          <div class="set-prog">${ownedCount}/${total} · ${pct}%</div>
          <div class="set-bar"><div class="set-fill" style="width:${pct}%"></div></div>
        </div>
      </div>`;
    });
    html+='</div>';
  });
  // All sets option
  const allActive=currentSet==='all';
  document.getElementById('sidebar').innerHTML=
    `<div class="set-item ${allActive?'active':''}" onclick="selectSet('all')" style="margin-bottom:8px;border-bottom:1px solid var(--b)">
      <div><div class="set-name" style="color:var(--gold)">All Cards</div>
      <div class="set-prog">${owned.size}/${CARDS.length} · ${Math.round(owned.size/CARDS.length*100)}%</div></div>
    </div>`+html;
}

function selectSet(id){
  currentSet=id;
  updateSidebar();
  render();
  document.getElementById('content').scrollTop=0;
}

function clearAll(){
  if(confirm('Clear ALL checked cards?')){owned.clear();save();render();updateSidebar();}}

function checkAll(){
  filtered().forEach(c=>owned.add(c.id));
  save();render();updateSidebar();
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
setSort('num');
updateSidebar();
render();
</script>
